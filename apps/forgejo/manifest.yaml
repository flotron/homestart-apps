id: forgejo
name: Forgejo
description: Lightweight self-hosted Git service.
category: Development
verified: true
verification_label: HomeStart reviewed
icon_url: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/forgejo.png
homepage: https://forgejo.org/
page_url: https://codeberg.org/forgejo/forgejo
link_label: Codeberg
compose_file: compose.yaml
inputs:
  - id: container_name
    label: Container name
    type: text
    default: forgejo
    pattern: '^[A-Za-z0-9_.-]+$'
  - id: web_port
    label: Web port
    type: port
    default: 3000
  - id: ssh_port
    label: SSH port
    type: port
    default: 2222
  - id: data_path
    label: Data folder
    type: path
    default: '{{homestart_data}}/forgejo'
  - id: timezone
    label: Time zone
    type: timezone
    default: '{{server_timezone}}'
